# Local, self-contained stack for students: `docker compose up`.
# Runs PostgreSQL + the Next.js app (which serves both the web UI and the API).
# No VPS required — everything runs on the student's machine.
#
# Configuration lives in .env.docker (copy it first):
#   cp .env.docker.example .env.docker   # then edit secrets
services:
  db:
    image: postgres:16
    container_name: scidi_activity_db
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      # Host port is overridable to avoid clashing with a local Postgres.
      - "${DB_PORT:-5432}:5432"
    volumes:
      - scidi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: scidi_activity_web
    restart: unless-stopped
    env_file:
      - .env.docker
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  scidi_pgdata:
